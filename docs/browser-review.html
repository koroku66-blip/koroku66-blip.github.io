<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio browser review</title><meta name="description" content="Temporary browser verification page"><style>body{margin:0;background:#e4e6e7;font:14px sans-serif}nav{padding:8px;display:flex;gap:8px;flex-wrap:wrap}iframe{display:block;border:0;background:white;height:850px}button,select{padding:10px}#results{max-height:200px;overflow:auto;white-space:pre-wrap;background:white;padding:12px;margin:0}h1{font-size:16px;margin:10px}</style></head><body><h1>表示と機能の確認</h1><nav><label>幅 <select id="width"><option>1280</option><option>768</option><option>390</option><option>375</option><option>320</option></select></label><label>ページ <select id="page"></select></label><button id="load">表示する</button><button id="suite">全ページ・5幅を検査</button></nav><pre id="results" role="status">検査前</pre><iframe title="確認対象" id="preview" width="1280"></iframe><script>
const paths=["credits.html", "index.html", "works/koumuten-b/index.html", "works/manufacturing/company.html", "works/manufacturing/contact.html", "works/manufacturing/index.html", "works/manufacturing/equipment.html", "works/manufacturing/business.html", "works/school/classroom.html", "works/school/courses.html", "works/school/index.html", "works/school/trial.html", "works/koumuten/index.html", "works/cleaning/index.html", "works/salon/salon.html", "works/salon/index.html", "works/salon/menu.html", "works/zeirishi/contact.html", "works/zeirishi/office.html", "works/zeirishi/index.html", "works/zeirishi/fees.html", "works/zeirishi/services.html", "works/cafe/visit.html", "works/cafe/index.html", "works/cafe/menu.html", "works/seitai/index.html"];const pg=document.getElementById('page'),f=document.getElementById('preview'),res=document.getElementById('results'),width=document.getElementById('width');for(const p of paths){const o=document.createElement('option');o.textContent=p;o.value=p;pg.append(o)}
function show(){f.style.width=width.value+'px';f.src='../'+pg.value}
document.getElementById('load').onclick=show;show();
document.getElementById('suite').onclick=async()=>{const results=[];document.getElementById('suite').disabled=true;for(const w of [1280,768,390,375,320]){width.value=String(w);f.style.width=w+'px';for(const path of paths){pg.value=path;res.textContent='確認中 '+w+'px '+path+' ('+results.length+'/130)';await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('load timeout '+path)),15000);f.onload=()=>{clearTimeout(timer);resolve()};f.src='../'+path});const d=f.contentDocument;await d.fonts.ready;for(const im of d.images)im.loading='eager';await Promise.all([...d.images].map(im=>im.decode().catch(()=>{})));await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const broken=[...d.images].filter(im=>!im.complete||!im.naturalWidth).map(im=>im.getAttribute('src'));const r={path,width:w,client:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,images:d.images.length,broken,h1:d.querySelectorAll('h1').length};results.push(r)}}f.onload=null;res.textContent=JSON.stringify({checked:results.length,failures:results.filter(r=>r.scroll>r.client+1||r.broken.length||r.h1!==1),results},null,2);document.getElementById('suite').disabled=false;};
</script></body></html>
